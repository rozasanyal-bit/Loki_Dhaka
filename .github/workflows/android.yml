name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Firebase Android configuration when supplied
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > artifacts/loki-bar/android/app/google-services.json
          fi

      - name: Build web application and sync Capacitor
        run: pnpm --filter @workspace/loki-bar run build:mobile

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: artifacts/loki-bar/android

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Loki-Bar-debug-apk
          path: artifacts/loki-bar/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
    
